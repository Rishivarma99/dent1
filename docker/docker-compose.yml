# Lock the compose project namespace so this stack stays isolated from any
# other stack running on the same host (e.g. b2b-analytics). Result:
#   - Containers:  dent1-api / dent1-frontend
#   - Network:     dent1_dent1-net (compose prefixes with the project name)
name: dent1

services:
  api:
    container_name: dent1-api
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      target: ${API_BUILD_TARGET:-development}
    restart: unless-stopped
    env_file:
      - ../.env
      - .env.newrelic
    environment:
      ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST:-host.docker.internal};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-Dent1};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_PORT:-5003}:8080"
    networks:
      - dent1-net

  frontend:
    container_name: dent1-frontend
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-production}
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_HOST_PORT:-4201}:${FRONTEND_CONTAINER_PORT:-80}"
    networks:
      - dent1-net
    depends_on:
      - api

networks:
  dent1-net:
    driver: bridge
