server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy backend API calls. FE makes requests to `/api/...` (relative);
    # nginx forwards them to the api container on the internal Docker network.
    # No CORS preflight, no hardcoded host/port in the FE.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Same proxy for the dev-only Scalar/OpenAPI endpoints so http://localhost:4201/scalar/v1 works.
    location ~ ^/(scalar|openapi)/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every other path serves index.html so Angular's router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
